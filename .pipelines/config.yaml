# CD for the homelab dashboard.
#
# Shape: build (production) -> deploy -> verify (processing, in list order).
#
# Unlike crafty-k8s, this one has a real build: the page is baked into an nginx
# image with Kaniko, the image tar travels in the ArtifactBundle, and deploy imports
# it into the node's containerd rather than pushing to a registry.
apiVersion: "0.0"
name: homelab-dashboard
description: Build and deploy the homelab link dashboard.
version: "1"

secrets:
  - name: SSH_PRIVATE_KEY
    description: SSH key for importing the image and running helm on the homelab host.

productionSteps:
  - name: build
    configuration:
      image: gcr.io/kaniko-project/executor:debug
      scriptFile: scripts/build.sh
      environmentVariables:
        REPO: OliverVea/homelab-dashboard
        BRANCH: main

processingSteps:
  - name: deploy
    configuration:
      image: alpine:latest
      scriptFile: scripts/deploy.sh
      environmentVariables:
        DEPLOY_HOST: oliver@bulwark-m2
        RELEASE: homelab-dashboard
        NAMESPACE: apps
  # helm --wait only proves the pod went Ready. This proves the page is actually
  # served through the ingress, at the real hostname.
  - name: verify
    configuration:
      image: alpine:latest
      scriptFile: scripts/verify.sh
      environmentVariables:
        DEPLOY_HOST: oliver@bulwark-m2
        RELEASE: homelab-dashboard
        NAMESPACE: apps
        SITE_URL: https://home-private.ovea.pro
        # Pin the check at the cluster ingress rather than trusting public DNS
        # from inside a pod, which can resolve to a different entrypoint entirely.
        INGRESS_IP: 192.168.11.8
